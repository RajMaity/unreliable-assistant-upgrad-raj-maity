[project]
name = "unreliable-assistant"
version = "0.1.0"
description = "Local PoC of The Unreliable Assistant (enterprise rebuild)"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pluggy>=1.5",
    "mcp>=1.10,<2",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fakeredis>=2.23",
    "redis>=5.0",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
# Specs are locked/read-only; ruff must not reformat their embedded code blocks.
extend-exclude = ["Docs", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["contracts", "mcp_servers"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "ragas: RAGAS golden-set evaluation",
    "live: calls the real OpenRouter API (needs OPENROUTER_API_KEY)",
]
